<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuxRoom | Authentication</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="./index.html">LuxRoom</a>
        <nav class="main-nav">
          <a href="./index.html">Home</a>
          <a href="./products.html">Product</a>
          <a href="./detail.html">About</a>
          <a href="./index.html#contact">Contact</a>
        </nav>
        <div class="topbar-actions">
          <span class="icon-button">Search</span>
          <span class="icon-button">Saved</span>
          <a href="./cart.html" class="icon-button" style="color: inherit; text-decoration: none;">Cart <span data-cart-count>0</span></a>
        </div>
      </header>

      <main class="auth-container">
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Sign In</button>
            <button class="auth-tab" id="tab-register">Create Account</button>
          </div>

          <!-- Login Form -->
          <form class="auth-form active" id="form-login">
            <div class="form-group">
              <label for="login-email">Email Address</label>
              <input type="email" id="login-email" required placeholder="hello@luxroom.com" />
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required placeholder="••••••••" />
            </div>
            <div class="auth-actions">
              <button type="submit" class="primary-button">Sign In</button>
            </div>
          </form>

          <!-- Register Form -->
          <form class="auth-form" id="form-register">
            <div class="form-group">
              <label for="reg-name">Full Name</label>
              <input type="text" id="reg-name" required placeholder="John Doe" />
            </div>
            <div class="form-group">
              <label for="reg-email">Email Address</label>
              <input type="email" id="reg-email" required placeholder="hello@luxroom.com" />
            </div>
            <div class="form-group">
              <label for="reg-password">Password</label>
              <input type="password" id="reg-password" required placeholder="••••••••" />
            </div>
            <div class="auth-actions">
              <button type="submit" class="primary-button">Create Account</button>
            </div>
          </form>
        </div>
      </main>

      <footer class="footer">
        <div>
          <h3>Contact</h3>
          <p>hello@luxroom.com</p>
          <p>+84 987 654 321</p>
          <p>District 1, Ho Chi Minh City</p>
        </div>
        <div>
          <h3>Information</h3>
          <p>About us</p>
          <p>Privacy policy</p>
          <p>Terms & conditions</p>
        </div>
        <div>
          <h3>Customer Service</h3>
          <p>Contact support</p>
          <p>Shipping information</p>
          <p>Returns & exchanges</p>
        </div>
      </footer>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
