name: Apply Header Rooms Navigation

on:
  push:
    branches:
      - 'uiux/header-rooms-navigation'
    paths:
      - '.github/workflows/header-rooms-implementation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uiux/header-rooms-navigation
      - name: Fix mobile discovery current scope
        run: python3 scripts/remediate-header-active-state.py
      - name: Verify diff and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/experience-upgrade.css
          git commit -m 'fix: expose active discovery scope on mobile'
          git push origin HEAD:uiux/header-rooms-navigation
