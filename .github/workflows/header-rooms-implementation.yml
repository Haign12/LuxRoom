name: Apply Header Rooms Navigation

on:
  push:
    branches:
      - 'uiux/header-rooms-navigation'
    paths:
      - '.github/workflows/header-rooms-implementation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uiux/header-rooms-navigation
      - name: Apply shared navigation change
        run: python3 scripts/apply-header-rooms.py
      - name: Verify diff and commit
        run: |
          git diff --check
          git restore .github/workflows/visual-qa.yml
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DESIGN-CONTRACT.md docs/visual-regression-plan.md js/common.js css/experience-upgrade.css qa/capture.mjs
          git commit -m 'feat: add Rooms as space-led primary navigation'
          git push origin HEAD:uiux/header-rooms-navigation
