name: Visual QA

on:
  push:
    branches:
      - uiux/luxroom-research-v2
      - uiux/header-rooms-navigation
      - uiux/rooms-page-hero-fix
      - main
    paths-ignore:
      - 'qa/evidence/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped Rooms source changes on remediation branch
        if: github.ref_name == 'uiux/rooms-page-hero-fix'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/common.js')
          s = p.read_text()
          old = 'roomNav.innerHTML = \'<a class="nav-rooms-link" href="index.html#room-edit-title" aria-haspopup="true" aria-expanded="false">Rooms</a>\';'
          new = 'roomNav.innerHTML = \'<a class="nav-rooms-link" href="rooms.html" aria-haspopup="true" aria-expanded="false">Rooms</a>\';'
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit('common.js Rooms href owner not found')
          old_active = '(isCollection && hasRoomScope) || (currentPage === "index.html" && window.location.hash === "#room-edit-title"),'
          new_active = '(isCollection && hasRoomScope) || currentPage === "rooms.html",'
          if old_active in s: s = s.replace(old_active, new_active, 1)
          elif new_active not in s: raise SystemExit('common.js Rooms active owner not found')
          p.write_text(s)

          p = Path('css/index.css')
          s = p.read_text()
          old = '  .hero-copy h1 { margin-block: 15px 22px; font-size: clamp(3.7rem, 15vw, 6.5rem); }'
          new = '  .hero-copy h1 { margin-block: 15px 22px; max-width: 100%; font-size: clamp(3.55rem, 11.8vw, 5.85rem); line-height: .88; }'
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit('index.css mobile hero owner not found')
          p.write_text(s)

          p = Path('qa/capture.mjs')
          s = p.read_text()
          if "const mid = { width: 700, height: 900 };" not in s:
              s = s.replace("const wide = { width: 1920, height: 1080 };", "const wide = { width: 1920, height: 1080 };\nconst mid = { width: 700, height: 900 };", 1)
          if "['rooms','rooms.html']" not in s:
              s = s.replace("  ['home','index.html'],\n  ['collection','products.html'],", "  ['home','index.html'],\n  ['rooms','rooms.html'],\n  ['collection','products.html'],", 1)
          if "await capture('home-700', 'index.html', mid);" not in s:
              s = s.replace("await capture('home-wide', 'index.html', wide);", "await capture('home-wide', 'index.html', wide);\nawait capture('home-700', 'index.html', mid);", 1)
          old_metrics = """  const metrics = await page.evaluate(() => ({
    title: document.title,
    scrollWidth: document.documentElement.scrollWidth,
    clientWidth: document.documentElement.clientWidth,
    bodyHeight: document.body.scrollHeight,
    h1: document.querySelector('h1')?.textContent?.trim() || '',
    active: document.querySelector('.main-nav a.active')?.textContent?.trim() || '',
  }));"""
          new_metrics = """  const metrics = await page.evaluate(() => {
    const accent = document.querySelector('#home-title em');
    const accentRect = accent?.getBoundingClientRect();
    return {
      title: document.title,
      scrollWidth: document.documentElement.scrollWidth,
      clientWidth: document.documentElement.clientWidth,
      bodyHeight: document.body.scrollHeight,
      h1: document.querySelector('h1')?.textContent?.trim() || '',
      active: document.querySelector('.main-nav a.active')?.textContent?.trim() || '',
      heroAccentRight: accentRect ? Math.round(accentRect.right) : null,
      heroAccentClipped: accentRect ? accentRect.right > window.innerWidth + 1 || accentRect.left < -1 : false,
    };
  });"""
          if old_metrics in s: s = s.replace(old_metrics, new_metrics, 1)
          elif 'heroAccentClipped' not in s: raise SystemExit('capture metrics owner not found')
          p.write_text(s)

          p = Path('docs/DESIGN-CONTRACT.md')
          if p.exists():
              s = p.read_text().replace('links to the existing homepage Shop-by-room hub', 'links to the dedicated `rooms.html` space-led editorial hub')
              p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual QA tooling
        run: |
          npm install --no-save playwright@1.55.0
          python3 -m pip install --quiet pillow
          echo "CHROME_BIN=$(which google-chrome || which chromium || which chromium-browser)" >> "$GITHUB_ENV"
      - name: Verify browser
        run: |
          "$CHROME_BIN" --version
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/luxroom-server.log 2>&1 &
          echo $! > /tmp/luxroom-server.pid
          sleep 2
      - name: Capture representative routes and states
        run: node qa/capture.mjs
      - name: Build visual contact sheets
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import json, math

          raw = Path('qa/evidence/raw')
          out = Path('qa/evidence')
          out.mkdir(parents=True, exist_ok=True)

          groups = {
            'desktop': ['home-desktop','rooms-desktop','collection-desktop','detail-desktop','about-desktop','contact-desktop','cart-desktop','checkout-desktop','home-700','home-scrolled-desktop','home-desktop-shop','home-desktop-rooms','home-desktop-search','collection-room-desktop'],
            'mobile': ['home-mobile','rooms-mobile','collection-mobile','detail-mobile','about-mobile','contact-mobile','cart-mobile','checkout-mobile','home-mobile-menu','home-mobile-search','collection-mobile-filter','collection-room-mobile-menu','detail-mobile-lower'],
          }

          def make_sheet(name, items, cell=(360,240), cols=3):
            label_h = 28
            rows = math.ceil(len(items)/cols)
            sheet = Image.new('RGB', (cols*cell[0], rows*(cell[1]+label_h)), 'white')
            draw = ImageDraw.Draw(sheet)
            for i, item in enumerate(items):
              img = Image.open(raw/f'{item}.png').convert('RGB')
              crop_h = min(img.height, int(img.width * cell[1] / cell[0]))
              img = img.crop((0,0,img.width,crop_h))
              thumb = ImageOps.fit(img, cell, method=Image.Resampling.LANCZOS, centering=(0.5,0.0))
              x=(i%cols)*cell[0]; y=(i//cols)*(cell[1]+label_h)
              sheet.paste(thumb,(x,y+label_h))
              draw.text((x+8,y+7),item,fill='black')
            sheet.save(out/f'contact-{name}.jpg', quality=72, optimize=True)

          for name, items in groups.items(): make_sheet(name, items)

          report=[]
          for p in sorted(raw.glob('*.json')):
            d=json.loads(p.read_text())
            report.append({'capture':p.stem, **d})
          Path('qa/evidence/runtime-report.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Upload full visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: luxroom-visual-qa
          path: qa/evidence/
          if-no-files-found: error
      - name: Commit source remediation and compact evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/evidence/contact-desktop.jpg qa/evidence/contact-mobile.jpg qa/evidence/runtime-report.json js/common.js css/index.css qa/capture.mjs docs/DESIGN-CONTRACT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: verify Rooms page and Home hero remediation'
          git push
